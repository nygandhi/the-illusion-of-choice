<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>In The Beginning</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="window">
        <div class="title-bar">
            <span>Decisons</span>
            <div class="buttons">
                <span>X</span>
            </div>
        </div>

        <div class="window-content">
            <p> Forget your childhood. It's not important. <span class="rotated">(Right?)</span> You're an adult now,
                and
                adults must make adult choices.
                Make a decision about the rest of your future. </p> <b> Don't look back. </b>
            <div class="button-row">
                <a href="Go-to-College" class="main-button">Go To College</a>
                <a href="Dont-Go-To-College" class="main-button">Dont Go To College</a>
            </div>
        </div>
    </div>

</body>
<style>
    body {
        background-color: black;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .window {
        width: 500px;
        background-color: #c0c0c0;
        border: 2px solid;
        border-color: white #404040 #404040 white;
        box-shadow: inset -1px -1px #000, inset 1px 1px #fff;
        font-family: "MS Sans Serif", Arial, sans-serif;
    }

    .title-bar {
        background: linear-gradient(to right, navy, blue);
        color: white;
        padding: 5px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 14px;
    }

    .buttons span {
        background: #c0c0c0;
        border: 1px solid #000;
        padding: 0 5px;
        margin-left: 3px;
        font-size: 12px;
    }

    .rotated {
        display: inline-block;
        animation: wiggle-animation 0.5s infinite; }

        @keyframes wiggle-animation {
  0% { transform: rotate(0deg); }
  25% { transform: rotate(2deg); }
  50% { transform: rotate(-2deg); }
  75% { transform: rotate(2deg); }
  100% { transform: rotate(0deg); }
}

    .window-content {
        padding: 20px;
        color: black;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px;
    }

    .window-content p {
        margin: 2px;
        line-height: 24px
    }

    .main-button {
        display: inline-block;
        margin-right: 10px;
        padding: 10px 20px;
        font-family: Arial, sans-serif;
        font-size: 16px;
        color: black;
        background-color: #c0c0c0;
        text-decoration: none;
        border: 2px solid;
        border-color: white #404040 #404040 white;
        box-shadow: inset -1px -1px #000, inset 1px 1px #fff;
    }

    .main-button:hover {
        cursor: pointer;
    }

    .main-button:active {
        transform: translate(1px, 1px);
        background-color: #004085;
    }

    .button-row {
        display: flex;
        gap: 10px;
    }
</style>

</html>
